name: Daily Reminders

on:
  schedule:
    # Runs every day at 6:00 AM UTC (8:00 AM Rwanda time)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Reminders
        run: |
          echo "Triggering daily reminders at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          response=$(curl -s -w "\n%{http_code}" \
            "https://serenadesofpraise.netlify.app/.netlify/functions/daily-reminders")
          
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" -eq 200 ]; then
            echo "Daily reminders sent successfully!"
          else
            echo "Warning: Function returned HTTP $http_code"
            exit 1
          fi
